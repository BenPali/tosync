services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=10.2.0.2/32
      # Use gluetun's own DNS-over-TLS instead of the Proton gateway's plaintext
      # DNS (10.2.0.1), which was timing out and keeping the container unhealthy.
      - SERVER_COUNTRIES=Switzerland
      - VPN_PORT_FORWARDING=on
      # Explicit killswitch: block all non-tunnel traffic so nothing leaks if
      # the VPN drops (this is gluetun's default, pinned here for clarity).
      - FIREWALL=on
    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:8888:8888"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tosync-private:
    build: .
    container_name: tosync-private
    network_mode: "service:gluetun"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ENABLE_TORRENTS=true
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_USERS=${ADMIN_USERS}
      # Storage limits (read from .env via substitution; app defaults are
      # larger than this host's 73G disk, so pass them explicitly).
      - MAX_UPLOAD_GB=${MAX_UPLOAD_GB}
      - MAX_ROOM_STORAGE_GB=${MAX_ROOM_STORAGE_GB}
      - MAX_TOTAL_STORAGE_GB=${MAX_TOTAL_STORAGE_GB}
    volumes:
      - ./rooms:/app/rooms
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tosync-public:
    build: .
    container_name: tosync-public
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ENABLE_TORRENTS=false
      - SESSION_SECRET=${SESSION_SECRET}
      - MAX_UPLOAD_GB=${MAX_UPLOAD_GB}
      - MAX_ROOM_STORAGE_GB=${MAX_ROOM_STORAGE_GB}
      - MAX_TOTAL_STORAGE_GB=${MAX_TOTAL_STORAGE_GB}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
